<!DOCTYPE html>
<html>
<head>
    <style>
        body {
            background: url('https://images.pexels.com/photos/11191243/pexels-photo-11191243.jpeg');
            background-position: center;
            background-size: cover;
            height: 100vh;
            margin: 0;
            align-items: center;
            justify-content: center;
            display: flex;
            padding: 0;
        }
       .uday{
           background-color:rgba(0,0,0,0.7);
           padding:40px;
           border-radius:10px;
           color:white;
           box-shadow:rgba(0,0,0,0.5);
           width:350px;
           text-align:center;
        }
       .uday h1{
           color :orangered;
           font-size:30px;
           margin-bottom:30px;
       }
       .uday input[type="text"],
       .uday input[type="password"]{
           width:90%;
           padding: 12px,15px;
           margin :10px,0;
           border-radius:5px;
           border:none;
           font-size:16px;

       }
       .uday a.login-btn{
           display:inline-block;
           width:30%;
           padding:32px,45px;
           margin-top:20px;
           color:white;
           background-color:orangered;
           text-decoration:none;
           border-radius:5px;
           font-weight:bold;
           font-size:16px;
          text-align:center;
           transition:background-color 0.3s ,ease;

       }
        
        .uday  a.login-btn:hover {
            background-color: #ff4500;
        }
        .uday p{
            margin-top:15px;
            font-size:16px;
            color:white;
        }


    </style>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, intial-scale=1.0" />
    <title>LAMBORGANI</title>
</head>
<body>
    <main>
        <div class="uday">
            <h1>LAMBORGINI</h1>
            <form>
                <input type="text" placeholder="username" required><br></br>
                <input type="password" placeholder="password" required><br>
                <a href="newfile.html" class="login-btn">login</a>
            </form>
            <p>Welcome to lamborgini Dashboard</p>
        </div>
    </main>

</body>
</html>
